<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <defs>
    <linearGradient id="gFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b6b86"/><stop offset="1" stop-color="#2c3850"/></linearGradient>
    <linearGradient id="gTop" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9fb0cc"/><stop offset="1" stop-color="#7589a8"/></linearGradient>
    <linearGradient id="gEnd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b4a66"/><stop offset="1" stop-color="#1c2638"/></linearGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <linearGradient id="gBoxF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient>
    <linearGradient id="gBoxT" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#3b82f6"/></linearGradient>
    <linearGradient id="gBoxS" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1d4ed8"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <radialGradient id="gGlow"><stop offset="0" stop-color="#fbbf24" stop-opacity=".9"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".06"/></pattern>
  </defs>

  <rect width="800" height="540" fill="url(#grid)"/>
  <ellipse cx="400" cy="505" rx="300" ry="20" fill="#000" opacity=".35" filter="url(#blur)"/>

  <!-- seluruh rig berayun pelan dari titik hook -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-1.4 400 40;1.4 400 40;-1.4 400 40" dur="7s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>

    <!-- crane hook -->
    <rect x="388" y="0" width="24" height="26" rx="4" fill="#475569"/>
    <circle cx="400" cy="44" r="20" fill="none" stroke="url(#gGold)" stroke-width="9"/>
    <path d="M400 64 v22 q0 26 -22 26 q-20 0 -20 -18" fill="none" stroke="url(#gGold)" stroke-width="11" stroke-linecap="round"/>
    <circle cx="400" cy="44" r="30" fill="url(#gGlow)" opacity=".55"/>

    <!-- sling ropes ke lifting lug A dan E -->
    <g stroke="#e2e8f0" stroke-width="3.2" stroke-linecap="round">
      <line x1="394" y1="100" x2="270" y2="218"/>
      <line x1="406" y1="100" x2="548" y2="218"/>
    </g>
    <g stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="7 9">
      <line x1="394" y1="100" x2="270" y2="218"><animate attributeName="stroke-dashoffset" values="0;-32" dur="1.6s" repeatCount="indefinite"/></line>
      <line x1="406" y1="100" x2="548" y2="218"><animate attributeName="stroke-dashoffset" values="0;-32" dur="1.6s" repeatCount="indefinite"/></line>
    </g>
    <path d="M300 168 A 40 40 0 0 1 311 196" fill="none" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="287" y="196" fill="#fbbf24" font-size="15" font-style="italic">θ</text>
    <path d="M510 190 A 40 40 0 0 0 524 208" fill="none" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="519" y="190" fill="#fbbf24" font-size="15" font-style="italic">β</text>
    <text x="318" y="140" fill="#cbd5e1" font-size="13" font-style="italic">F<tspan font-size="10" dy="3">A</tspan></text>
    <text x="478" y="140" fill="#cbd5e1" font-size="13" font-style="italic">F<tspan font-size="10" dy="3">B</tspan></text>

    <!-- lifting lugs -->
    <g>
      <path d="M255 250 v-26 q0 -14 15 -14 q15 0 15 14 v26z" fill="#64748b" stroke="#0f172a" stroke-opacity=".5"/>
      <circle cx="270" cy="224" r="7" fill="#0f172a"/><circle cx="270" cy="224" r="10" fill="none" stroke="url(#gGold)" stroke-width="3"/>
      <path d="M533 250 v-26 q0 -14 15 -14 q15 0 15 14 v26z" fill="#64748b" stroke="#0f172a" stroke-opacity=".5"/>
      <circle cx="548" cy="224" r="7" fill="#0f172a"/><circle cx="548" cy="224" r="10" fill="none" stroke="url(#gGold)" stroke-width="3"/>
      <circle cx="270" cy="224" r="16" fill="url(#gGlow)"><animate attributeName="opacity" values=".2;.9;.2" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="548" cy="224" r="16" fill="url(#gGlow)"><animate attributeName="opacity" values=".9;.2;.9" dur="2.4s" repeatCount="indefinite"/></circle>
    </g>

    <!-- spreader beam (I-beam, tampilan isometrik) -->
    <polygon points="110,250 650,250 690,226 150,226" fill="url(#gTop)"/>
    <rect x="110" y="250" width="540" height="36" fill="url(#gFront)"/>
    <rect x="110" y="250" width="540" height="5" fill="#ffffff" opacity=".18"/>
    <rect x="110" y="281" width="540" height="5" fill="#000" opacity=".25"/>
    <polygon points="650,250 690,226 690,262 650,286" fill="url(#gEnd)"/>
    <!-- profil I di ujung -->
    <path d="M656,248 L684,229 L684,233 L672,241 L672,255 L684,247 L684,260 L656,283 Z" fill="#0f172a" opacity=".25"/>
    <g stroke="#0b1220" stroke-opacity=".35"><line x1="230" y1="255" x2="230" y2="282"/><line x1="390" y1="255" x2="390" y2="282"/><line x1="470" y1="255" x2="470" y2="282"/></g>

    <!-- titik beban F1..F4 -->
    <g fill="#fbbf24">
      <circle cx="130" cy="286" r="5"/><circle cx="330" cy="286" r="5"/><circle cx="480" cy="286" r="5"/><circle cx="640" cy="286" r="5"/>
    </g>
    <circle cx="410" cy="268" r="9" fill="#fff" stroke="#0b1220" stroke-width="2"/><path d="M410 268 v-9 a9 9 0 0 1 9 9z M410 268 v9 a9 9 0 0 1 -9 -9z" fill="#0b1220"/>

    <!-- tali ke beban -->
    <g stroke="#cbd5e1" stroke-width="2.4" stroke-linecap="round">
      <line x1="130" y1="291" x2="190" y2="372"/>
      <line x1="330" y1="291" x2="300" y2="372"/>
      <line x1="480" y1="291" x2="510" y2="372"/>
      <line x1="640" y1="291" x2="610" y2="372"/>
    </g>
    <g fill="#fbbf24" font-size="14" font-style="italic" text-anchor="middle">
      <text x="104" y="320">F<tspan font-size="10" dy="3">1</tspan></text>
      <text x="320" y="330">F<tspan font-size="10" dy="3">2</tspan></text>
      <text x="505" y="330">F<tspan font-size="10" dy="3">3</tspan></text>
      <text x="660" y="320">F<tspan font-size="10" dy="3">4</tspan></text>
      <text x="410" y="312" fill="#94a3b8">W<tspan font-size="10" dy="3">s</tspan></text>
    </g>

    <!-- beban (container isometrik) -->
    <polygon points="170,372 630,372 690,346 230,346" fill="url(#gBoxT)"/>
    <rect x="170" y="372" width="460" height="110" rx="2" fill="url(#gBoxF)"/>
    <polygon points="630,372 690,346 690,456 630,482" fill="url(#gBoxS)"/>
    <g stroke="#bfdbfe" stroke-opacity=".28">
      <line x1="230" y1="372" x2="230" y2="482"/><line x1="290" y1="372" x2="290" y2="482"/><line x1="350" y1="372" x2="350" y2="482"/>
      <line x1="410" y1="372" x2="410" y2="482"/><line x1="470" y1="372" x2="470" y2="482"/><line x1="530" y1="372" x2="530" y2="482"/><line x1="590" y1="372" x2="590" y2="482"/>
    </g>
    <text x="400" y="438" fill="#dbeafe" font-size="26" font-weight="700" text-anchor="middle" letter-spacing="4">200 TON</text>
    <g fill="#0b1220"><circle cx="190" cy="372" r="4"/><circle cx="300" cy="372" r="4"/><circle cx="510" cy="372" r="4"/><circle cx="610" cy="372" r="4"/></g>
  </g>
</svg>
