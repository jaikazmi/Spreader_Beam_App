<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" font-family="system-ui,Segoe UI,Arial,sans-serif">
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7488a6"/><stop offset="1" stop-color="#3a4a66"/></linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b6c4dc"/><stop offset="1" stop-color="#8ea1bf"/></linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2d3b55"/><stop offset="1" stop-color="#1a2335"/></linearGradient>
    <pattern id="g" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="560" height="420" fill="url(#g)"/>
  <ellipse cx="300" cy="396" rx="190" ry="12" fill="#000" opacity=".3"/>

  <!-- ekstrusi isometrik: dx=90, dy=-55 -->
  <!-- sisi atas flange atas -->
  <polygon points="110,70 310,70 400,15 200,15" fill="url(#t)"/>
  <!-- sisi kanan flange atas -->
  <polygon points="310,70 400,15 400,40 310,95" fill="url(#s)"/>
  <!-- sisi kanan web -->
  <polygon points="225,95 225,300 315,245 315,40" fill="#000" opacity="0"/>
  <polygon points="226,95 316,40 316,245 226,300" fill="url(#s)" opacity=".75"/>
  <!-- sisi kanan flange bawah -->
  <polygon points="310,300 400,245 400,270 310,325" fill="url(#s)"/>
  <!-- sisi atas flange bawah (kiri & kanan web) -->
  <polygon points="110,300 226,300 316,245 200,245" fill="url(#t)" opacity=".55"/>
  <polygon points="226,300 310,300 400,245 316,245" fill="url(#t)" opacity=".55"/>
  <!-- bidang depan I -->
  <path d="M110,70 H310 V95 H226 V300 H310 V325 H110 V300 H194 V95 H110 Z" fill="url(#f)" stroke="#0b1220" stroke-opacity=".5" stroke-width="1.5"/>
  <path d="M110,70 H310 V76 H110Z" fill="#fff" opacity=".18"/>

  <!-- sumbu netral -->
  <line x1="70" y1="197.5" x2="350" y2="197.5" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" values="0;-28" dur="2s" repeatCount="indefinite"/></line>
  <text x="352" y="201" fill="#fbbf24" font-size="13" font-style="italic">sumbu netral</text>

  <!-- dimensi -->
  <g stroke="#38bdf8" stroke-width="1.4" fill="#38bdf8" font-size="15" font-style="italic">
    <line x1="80" y1="70" x2="80" y2="325"/><line x1="72" y1="70" x2="108" y2="70" stroke-opacity=".5"/><line x1="72" y1="325" x2="108" y2="325" stroke-opacity=".5"/>
    <text x="48" y="202" stroke="none">H</text>
    <line x1="110" y1="352" x2="310" y2="352"/><line x1="110" y1="330" x2="110" y2="360" stroke-opacity=".5"/><line x1="310" y1="330" x2="310" y2="360" stroke-opacity=".5"/>
    <text x="205" y="376" stroke="none">B</text>
    <line x1="342" y1="70" x2="342" y2="95" stroke="#f472b6"/><text x="350" y="88" fill="#f472b6" stroke="none">t<tspan font-size="11" dy="3">f</tspan></text>
    <line x1="194" y1="150" x2="226" y2="150" stroke="#a3e635"/><text x="232" y="146" fill="#a3e635" stroke="none">t<tspan font-size="11" dy="3">w</tspan></text>
  </g>
</svg>
